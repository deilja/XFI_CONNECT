[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["venv", ".snapshots", "__pycache__", ".git"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
