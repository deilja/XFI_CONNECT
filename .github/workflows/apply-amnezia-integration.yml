name: apply-amnezia-integration

on:
  push:
    branches: [feature/amnezia-admin-api]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/amnezia-admin-api
          fetch-depth: 0

      - name: Patch XFI_CONNECT
        run: |
          python3 - <<'PY'
          from pathlib import Path

          vpn = Path('bot/services/vpn_api.py')
          text = vpn.read_text()

          old = 'from .panels.xui import XUIClient\n'
          new = old + 'from .panels.amnezia import AmneziaClient, AMNEZIA_PROFILE\n'
          if new not in text:
              if old not in text:
                  raise SystemExit('vpn_api import anchor not found')
              text = text.replace(old, new, 1)

          old = '''    client = XUIClient(server)\n        \n    _clients[server_id] = client\n    return client\n'''
          new = '''    if str(server.get("panel_api_profile") or "").strip().lower() == AMNEZIA_PROFILE:\n        client = AmneziaClient(server)\n    else:\n        client = XUIClient(server)\n\n    _clients[server_id] = client\n    return client\n'''
          if old not in text:
              raise SystemExit('vpn_api factory anchor not found')
          text = text.replace(old, new, 1)

          old = '''    client = XUIClient(server_data)\n    try:\n        await client.login()\n        stats = await client.get_stats()\n        return {'success': True, 'message': 'Подключение успешно!', 'stats': stats}\n    except VPNAPIError as e:\n        return {'success': False, 'message': f'Ошибка: {e}', 'stats': None}\n    finally:\n        await client.close()\n'''
          new = '''    client = XUIClient(server_data)\n    try:\n        await client.login()\n        stats = await client.get_stats()\n        return {\n            'success': True,\n            'message': 'Подключение к 3X-UI успешно!',\n            'stats': stats,\n            'panel_api_profile': getattr(client, 'api_profile', None) or 'legacy_inbounds',\n        }\n    except VPNAPIError as xui_error:\n        # The same server-management dialog can provision an Amnezia Admin API\n        # endpoint when the supplied API key is an Amnezia x-api-key.\n        try:\n            await client.close()\n        except Exception:\n            pass\n        amnezia = AmneziaClient(server_data)\n        try:\n            if await amnezia.health_check():\n                stats = await amnezia.get_stats()\n                return {\n                    'success': True,\n                    'message': 'Подключение к Amnezia Admin API успешно!',\n                    'stats': stats,\n                    'panel_api_profile': AMNEZIA_PROFILE,\n                }\n        finally:\n            await amnezia.close()\n        return {\n            'success': False,\n            'message': f'Ошибка 3X-UI/Amnezia API: {xui_error}',\n            'stats': None,\n        }\n    finally:\n        if not client._session if hasattr(client, '_session') else False:\n            pass\n        else:\n            try:\n                await client.close()\n            except Exception:\n                pass\n'''
          if old not in text:
              raise SystemExit('vpn_api test anchor not found')
          text = text.replace(old, new, 1)
          vpn.write_text(text)

          servers = Path('bot/handlers/admin/servers.py')
          text = servers.read_text()
          old = '''        await state.update_data(\n            server_data=server_data,\n            connection_test_passed=bool(test_result['success']),\n        )\n'''
          new = '''        if test_result.get('panel_api_profile'):\n            server_data['panel_api_profile'] = test_result['panel_api_profile']\n        await state.update_data(\n            server_data=server_data,\n            connection_test_passed=bool(test_result['success']),\n        )\n'''
          if text.count(old) < 1:
              raise SystemExit('servers test-save anchor not found')
          text = text.replace(old, new)
          servers.write_text(text)
          PY

      - name: Syntax check
        run: python3 -m compileall -q bot/services/panels/amnezia.py bot/services/vpn_api.py bot/handlers/admin/servers.py

      - name: Commit generated integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot/services/panels/amnezia.py bot/services/vpn_api.py bot/handlers/admin/servers.py .github/workflows/apply-amnezia-integration.yml
          git rm -f .github/workflows/apply-amnezia-integration.yml
          git commit -m 'feat: integrate Amnezia Admin API with XFI_CONNECT' || exit 0
          git push origin HEAD:feature/amnezia-admin-api
