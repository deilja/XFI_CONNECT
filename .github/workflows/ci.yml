name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: Prepare CI config
        run: cp config.py.example config.py
      - name: Compile Python sources
        run: python -m compileall -q . -x '(^|/)(\.git|\.snapshots|__pycache__|venv)(/|$)'
      - name: Ruff lint changed Python files
        env:
          PYTHONPATH: .
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA}" ] || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [ -z "${BASE_SHA}" ]; then
            echo "No base commit available; skipping changed-file Ruff check."
            exit 0
          fi
          git diff --name-only "${BASE_SHA}" "${GITHUB_SHA}" -- '*.py' > /tmp/ruff-files.txt
          if [ ! -s /tmp/ruff-files.txt ]; then
            echo "No changed Python files."
            exit 0
          fi
          echo "Ruff files:"
          cat /tmp/ruff-files.txt
          xargs -r python -m ruff check < /tmp/ruff-files.txt
      - name: Validate XFI updater imports
        run: |
          python - <<'PY'
          from bot.services import xfi_update, xfi_health
          from bot.utils import git_utils
          assert xfi_update.REPOSITORY == "deilja/XFI_CONNECT"
          assert xfi_update.BRANCH == "main"
          assert xfi_update.SERVICE_NAME == "xfi-connect"
          assert xfi_health.SERVICE_NAME == "xfi-connect"
          print("XFI updater imports: OK")
          PY
      - name: Run complete regression suite
        env:
          PYTHONPATH: .
        run: pytest -q
