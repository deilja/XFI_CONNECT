name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Prepare CI config
        run: cp config.py.example config.py
      - name: Compile Python sources
        run: python -m compileall -q . -x '(^|/)(\.git|\.snapshots|__pycache__|venv)(/|$)'
      - name: Validate XFI updater imports
        run: |
          python - <<'PY'
          from bot.services import xfi_update
          from bot.utils import git_utils
          assert xfi_update.REPOSITORY == "deilja/XFI_CONNECT"
          assert xfi_update.BRANCH == "main"
          assert xfi_update.SERVICE_NAME == "xfi-connect"
          print("XFI updater imports: OK")
          PY
      - name: Run regression tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_xfi_update.py tests/test_ai_agent.py
