name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Prepare CI config
        run: cp config.py.example config.py
      - name: Compile Python sources
        run: python -m compileall -q . -x '(^|/)(\.git|\.snapshots|__pycache__|venv)(/|$)'
      - name: Import application modules
        run: |
          python - <<'PY'
          import bot
          import bot.handlers.admin
          import bot.services.xfi_update
          import bot.services.ai_agent
          import bot.services.cryptobot
          import bot.services.cryptobot_provider
          import bot.services.vpn_api
          print("Application imports: OK")
          PY
      - name: Run regression tests
        run: pytest -q
